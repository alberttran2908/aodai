<style>
  html, body { margin: 0; height: 100%; background: #2b1d18; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { display: block; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
  /* phones held upright: the shop is a wide room, ask to turn the phone */
  #turn { display: none; position: fixed; inset: 0; z-index: 9; align-items: center; justify-content: center; background: #2b1d18; }
  #turn .card { width: min(80vw, 340px); padding: 28px 22px 24px; border-radius: 22px; background: #fbf4e8; border: 3px solid #4a2c22; box-shadow: 0 8px 0 #7a2330; text-align: center; font-family: 'Be Vietnam Pro', sans-serif; color: #4a2c22; }
  #turn h1 { margin: 14px 0 6px; font: 800 24px 'Baloo 2', sans-serif; color: #b23a48; }
  #turn p { margin: 0; font-size: 15px; line-height: 1.45; }
  #turn svg { animation: tilt 2.2s ease-in-out infinite; }
  @keyframes tilt { 0%, 30% { transform: rotate(0deg); } 60%, 100% { transform: rotate(-90deg); } }
  @media (orientation: portrait) and (max-width: 900px) { #turn { display: flex; } }
</style>
